# nginx config for the MikeTaps static site.
# Traffic arrives from cloudflared on the host. HTTPS is handled at Cloudflare's edge.

server {
    listen 8080;
    server_name _;

    root /srv/miketaps/site/current;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Redirects (like /gameday to /gameday/) use a relative Location, so they never
    # send visitors to the container's internal port or to plain http.
    absolute_redirect off;

    # Security headers
    # The two cloudflareinsights.com entries let Cloudflare Web Analytics count visits.
    # It sets no cookies and collects no personal data. Remove them to turn counting off.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    # Hashed build assets never change, so cache them hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: let Cloudflare and browsers revalidate so new releases show up quickly
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Never serve dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}

# Health check for Docker only. Port 8081 is never published, so nothing outside
# the container can reach it.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
