# nginx config for the MikeTaps static site.
# Traffic arrives from cloudflared on the host. HTTPS is handled at Cloudflare's edge.

server {
    listen 8080;
    server_name _;

    root /srv/miketaps/current;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    # Health check for Docker and Uptime Kuma (local only)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change, so cache them hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: let Cloudflare and browsers revalidate so new releases show up quickly
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Never serve dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
